<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BookRec · 下一本好书</title>
<style>body{margin:0;background:#f5f3ee;color:#182f30;font:16px system-ui}main{max-width:1000px;margin:60px auto;padding:24px}h1{font-size:54px;margin-bottom:8px}.label{letter-spacing:3px;color:#567966}p{line-height:1.7;color:#586461}form{display:flex;gap:12px;margin:30px 0;align-items:center;flex-wrap:wrap}input,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #bdc9bd}button{background:#244d40;color:white;cursor:pointer}#books{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}article{background:white;border-radius:12px;padding:24px;border-top:4px solid #bba571}article span{color:#958359}h3{line-height:1.5}small{color:#666}a{color:#32664e}</style>
<main><div class="label">GOODREADS POETRY / BOOKREC</div><h1>下一本，读点诗。</h1><p>从读过的书出发，发现值得翻开的下一页。<br>输入项目内部用户编号获取个性化推荐；未见过的编号将展示热门书籍。</p><form id="form"><label>用户编号 <input id="user" type="number" value="0" min="0" required></label><button>发现好书</button></form><p id="status" role="status"></p><section id="books"></section><p><a href="/docs">查看 API 文档</a> · 研究演示，推荐分数不代表真实点击概率。</p></main>
<script>const form=document.querySelector('#form'),status=document.querySelector('#status'),books=document.querySelector('#books');form.onsubmit=async e=>{e.preventDefault();status.textContent='正在寻找好书…';books.replaceChildren();try{const r=await fetch('/recommend?user_id='+encodeURIComponent(document.querySelector('#user').value)+'&k=10');if(!r.ok)throw Error('请求失败 '+r.status);const d=await r.json();status.textContent=(d.strategy.includes('cold')?'热门推荐':'为你推荐')+' · '+d.items.length+' 本 · '+d.latency_ms.toFixed(1)+' ms';d.items.forEach((b,j)=>{const card=document.createElement('article'),n=document.createElement('span'),h=document.createElement('h3'),s=document.createElement('small');n.textContent=String(j+1).padStart(2,'0');h.textContent=b.title;s.textContent='Goodreads #'+b.book_id;card.append(n,h,s);books.append(card)})}catch(e){status.textContent=e.message}};form.requestSubmit();</script></html>
